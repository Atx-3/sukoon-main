<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sukoon - Health Companion</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Custom styles to make it feel more like a native app */
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        .mobile-container {
            max-width: 420px;
            height: 896px;
            margin: auto;
            border: 8px solid #1a202c;
            border-radius: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            background-color: #f8fafc;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }

        .nav-item.active svg, .nav-item.active p { color: #2563eb; }
        
        #sos-progress { transition: width 0.5s ease-in-out; }
        #sos-button-container { transition: transform 0.3s ease-in-out; }
        #sos-button-container.keyboard-visible { transform: translateY(-80px); }
        #sos-button-container.recording { transform: translateY(-60px); }


        /* Animation for screen transitions */
        .page, .overlay {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .otp-input {
            width: 40px;
            height: 40px;
            text-align: center;
            font-size: 1.25rem;
            border: 2px solid #d1d5db;
            border-radius: 0.5rem;
            margin: 0 4px;
        }
        #user-video, #camera-preview {
            transform: scaleX(-1); /* Mirror effect for front camera */
        }
        .call-btn.active {
            background-color: #3b82f6; /* Blue-500 */
        }
        .graph-tab.active, .sub-tab-button.active {
            background-color: #3b82f6;
            color: white;
        }
    </style>
</head>
<body class="bg-gray-200 flex items-center justify-center min-h-screen">

    <div class="mobile-container">
        <div id="app-container" class="w-full h-full flex flex-col">
            </div>
        <div id="overlay-container"></div>
    </div>

    <template id="splash-screen-template">
        <div class="w-full h-full flex flex-col items-center justify-center bg-blue-600 text-white">
            <i data-lucide="heart-pulse" class="w-24 h-24 mb-4 animate-pulse"></i>
            <h1 class="text-4xl font-bold">Sukoon</h1>
            <p class="text-lg mt-2">Jiyo Sukoon Se</p>
        </div>
    </template>

    <template id="login-screen-template">
        <div class="w-full h-full flex flex-col justify-center items-center p-8 bg-gray-50 page">
            <i data-lucide="heart-pulse" class="w-16 h-16 text-blue-600 mb-4"></i>
            <h1 class="text-3xl font-bold text-gray-800">Welcome to Sukoon</h1>
            <p class="text-gray-500 mb-8">Your personal health companion.</p>
            <div class="w-full space-y-4">
                <button id="google-login-btn" class="w-full bg-white border border-gray-300 text-gray-700 font-semibold py-3 rounded-xl flex items-center justify-center shadow-sm">
                    <img src="https://www.google.com/favicon.ico" class="w-5 h-5 mr-3" alt="Google icon">
                    Continue with Google
                </button>
                 <button id="apple-login-btn" class="w-full bg-black text-white font-semibold py-3 rounded-xl flex items-center justify-center shadow-sm">
                    <i data-lucide="apple" class="w-5 h-5 mr-3 fill-white"></i>

                    Continue with Phone Number
                </button>
            </div>
        </div>
    </template>
    
    <template id="email-login-template">
        <div class="w-full h-full flex flex-col justify-center p-8 bg-gray-50 page">

    <template id="phone-login-template">

        </div>
    </template>
    
    <template id="otp-template">
        <div class="w-full h-full flex flex-col justify-center p-8 bg-gray-50 page">

                <input type="number" class="otp-input" maxlength="1">

            function renderScreen(screenName, data = {}) {
                appContainer.innerHTML = templates[screenName];
                lucide.createIcons();

                if (screenName === 'email-login') setupEmailLoginListeners(data);
                if (screenName === 'phone-login') setupPhoneLoginListeners();
                if (screenName === 'otp') setupOtpListeners();
                if (screenName === 'main') {

            function showConfirmationOverlay(title, message) {

                document.getElementById('close-confirmation-btn').addEventListener('click', closeOverlay);

            function closeOverlay() {
                 if (mediaStream) {
                    mediaStream.getTracks().forEach(track => track.stop());
                    mediaStream = null;
                }
                overlayContainer.innerHTML = '';

            function navigateTo(page, data = {}) {
                if (currentPage !== page && currentPage !== 'main') {
                    pageHistory.push(currentPage);
                }
                const mainContent = document.getElementById('main-content');
                if (!mainContent) return;
                
                currentPage = page;
                if(page === 'coach-chat') currentCoachData = data;

                mainContent.innerHTML = templates[page] || '';
                lucide.createIcons();
                
                updateNavActiveState(page);
                
                if (page === 'home') setupHomeAndPlanItemListeners();
                if (page === 'plan') setupPlanTabs();
                if (page === 'profile') setupProfileListeners();
                if (page === 'coach-list') setupCoachListListeners();
                if (page === 'coach-chat') setupChatPage(data);
                if (page === 'vitals') setupVitalsPage();
                if (page === 'vital-detail') setupVitalDetailPage(data);
                if (page === 'connect-wearable') setupConnectWearableListeners();
                if (page === 'my-doctors') setupMyDoctorsPage();
                if (page === 'second-opinion') setupDetailPage(()=>navigateTo('profile'));
                if (page === 'emergency-contacts') setupEmergencyContactsPage();
                if (page === 'contact-us') setupDetailPage(()=>navigateTo('profile'));
                if (page === 'medicine-cabinet') setupMedicineCabinetPage();
                if (page === 'ai-insights') setupDetailPage(goBack);
                if (page === 'meal-detail') setupMealDetailPage(data);
                if (page === 'workout-detail') setupWorkoutDetailPage(data);
            }

            function goBack() {
                const previousPage = pageHistory.pop() || 'home';
                if (['meal-detail', 'workout-detail', 'ai-insights', 'vital-detail'].includes(previousPage)) {
                    const lastMainPage = pageHistory.find(p => !['meal-detail', 'workout-detail', 'ai-insights', 'vital-detail'].includes(p)) || 'home';
                    navigateTo(lastMainPage);
                } else {
                     navigateTo(previousPage);
                }
            }
            
            function updateNavActiveState(page) {
                document.querySelectorAll('.nav-item').forEach(item => {
                    const pageName = item.dataset.page;
                    const isCoachRelated = (page === 'coach-list' || page === 'coach-chat');
                    const profilePages = ['profile', 'connect-wearable', 'my-doctors', 'medicine-cabinet', 'second-opinion', 'emergency-contacts', 'contact-us'];
                    const isProfileRelated = profilePages.includes(page);
                    
                    if (pageName === 'coach-list') item.classList.toggle('active', isCoachRelated);
                    else if (pageName === 'profile') item.classList.toggle('active', isProfileRelated);
                    else if (pageName === 'vitals') item.classList.toggle('active', page === 'vitals' || page === 'vital-detail');
                    else item.classList.toggle('active', pageName === page);
                });

            // --- LOGIN FLOW SETUP ---
            function setupLoginListeners() {
                document.getElementById('google-login-btn').addEventListener('click', () => renderScreen('email-login', { provider: 'Google' }));
                document.getElementById('apple-login-btn').addEventListener('click', () => renderScreen('email-login', { provider: 'Apple' }));
                document.getElementById('phone-login-btn').addEventListener('click', () => renderScreen('phone-login'));
            }

            function setupEmailLoginListeners(data) {
                document.querySelector('.back-to-login').addEventListener('click', () => renderScreen('login'));
                document.getElementById('email-provider-text').innerText = `to continue with ${data.provider}`;
                const emailInput = document.getElementById('email-input');
                const nextBtn = document.getElementById('email-next-btn');
                nextBtn.disabled = true;
                emailInput.addEventListener('input', () => {
                    nextBtn.disabled = emailInput.value.trim() === '' || !emailInput.value.includes('@');
                });
                nextBtn.addEventListener('click', () => {
                    if (!nextBtn.disabled) renderScreen('main');
                });
            }

            function setupPhoneLoginListeners() {
                document.querySelector('.back-to-login').addEventListener('click', () => renderScreen('login'));
                const phoneInput = document.getElementById('phone-input');
                const nextBtn = document.getElementById('phone-next-btn');
                nextBtn.disabled = true;
                phoneInput.addEventListener('input', () => {
                    nextBtn.disabled = phoneInput.value.trim().length < 10;
                });
                nextBtn.addEventListener('click', () => {
                    if (!nextBtn.disabled) renderScreen('otp', { phone: phoneInput.value });
                });
            }

            function setupOtpListeners() {
                document.querySelector('.back-to-phone-login').addEventListener('click', () => renderScreen('phone-login'));
                const inputs = document.querySelectorAll('.otp-input');
                const verifyBtn = document.getElementById('otp-next-btn');
                verifyBtn.disabled = true;
                inputs.forEach((input, index) => {
                    input.addEventListener('input', () => {
                        if (input.value.length >= 1 && index < inputs.length - 1) {
                            inputs[index + 1].focus();
                        }
                        const isComplete = Array.from(inputs).every(i => i.value.length > 0);
                        verifyBtn.disabled = !isComplete;
                    });
                     input.addEventListener('keydown', (e) => {
                        if (e.key === "Backspace" && input.value.length === 0 && index > 0) {
                            inputs[index - 1].focus();
                        }
                    });
                });
                 verifyBtn.addEventListener('click', () => {
                    if (!verifyBtn.disabled) renderScreen('main');
                });
            }

            function setupVitalDetailPage(data) {
                setupDetailPage(() => navigateTo('vitals'));
                document.getElementById('vital-title').textContent = data.title;
                const iconEl = document.getElementById('vital-icon');
                iconEl.dataset.lucide = data.icon;
                iconEl.className = `w-6 h-6 mr-3 ${data.color}`;

                document.getElementById('vital-stat-low').textContent = data.stats.low;
                document.getElementById('vital-ai-insight').textContent = data.insight;
                
                lucide.createIcons();

                const renderGraph = (period) => {
                    const graphContainer = document.getElementById('graph-container');
                    const labelsContainer = document.getElementById('graph-labels');
                    graphContainer.innerHTML = '';
                    labelsContainer.innerHTML = '';

                    const values = data.data[period.toLowerCase()];
                    if (!values || !Array.isArray(values) || values.length === 0) return;

                    const labels = {
                        d: ['12am', '4am', '8am', '12pm', '4pm', '8pm'],
                        w: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                        m: ['1-5', '6-10', '11-15', '16-20', '21-25', '26-30']
                    };

                    const currentLabels = labels[period.toLowerCase()];
                    
                    const maxVal = Math.max(...values);
                    values.forEach(value => {
                        const bar = document.createElement('div');
                        const height = maxVal > 0 ? (value / maxVal * 100) : 0;
                        bar.className = 'w-1/12 rounded-t-sm';
                        bar.style.height = `${height}%`;
                        bar.style.backgroundColor = data.barColor;
                        graphContainer.appendChild(bar);
                    });

                    currentLabels.forEach(label => {
                        const labelEl = document.createElement('div');
                        labelEl.className = 'flex-1 text-center';
                        labelEl.textContent = label;
                        labelsContainer.appendChild(labelEl);
                    });
                };
                
                renderGraph('D');

                document.querySelectorAll('.graph-tab').forEach(tab => {
                    tab.addEventListener('click', (e) => {
                        document.querySelectorAll('.graph-tab').forEach(t => t.classList.remove('active'));
                        e.currentTarget.classList.add('active');
                        renderGraph(e.currentTarget.dataset.period);
                    });
                });
            }

                const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                let content = '';
                if(type === 'text') {
                    content = `<p>${message}</p>`;
                } else if (type === 'voice') {
                    content = `<div class="flex items-center"><i data-lucide="play" class="mr-2"></i> Voice Note (0:${message})</div>`;
                } else if (type === 'image') {
                    content = `<div class="flex items-center text-sm"><i data-lucide="image" class="mr-2"></i> ${message}</div>`;
                }
                else {
                    content = `<div class="flex items-center text-sm"><i data-lucide="file" class="mr-2"></i> ${message}</div>`;
                }

                if (isUser) {
                    messageDiv.className = 'flex justify-end';
                    messageDiv.innerHTML = `<div class="bg-blue-600 text-white p-3 rounded-2xl rounded-br-lg max-w-xs">${content}<p class="text-xs text-blue-200 text-right mt-1">${time}</p></div>`;
                } else { // System message
                    messageDiv.className = 'text-center text-xs text-gray-500 py-2';
                    messageDiv.innerHTML = `${message} at ${time}`;
                }
                chatHistory.appendChild(messageDiv);
                lucide.createIcons();
                chatHistory.scrollTop = chatHistory.scrollHeight;
            }

            function setupChatPage(coachData) {
                currentCoachData = coachData;
                document.getElementById('chat-name').innerText = coachData.name;
                document.getElementById('chat-status').innerText = coachData.title;
                document.getElementById('chat-avatar').src = `https://placehold.co/40x40/E2E8F0/4A5568?text=${coachData.avatar}`;
                document.querySelector('.back-button-chat').addEventListener('click', () => navigateTo('coach-list'));

                const chatInput = document.getElementById('chat-input');
                const sosContainer = document.getElementById('sos-button-container');
                const micOrSendBtn = document.getElementById('mic-or-send-btn');
                const voiceNoteUI = document.getElementById('voice-note-ui');
                const textInputUI = document.getElementById('text-input-ui');
                let voiceTimer;

                chatInput.addEventListener('focus', () => { sosContainer.classList.add('keyboard-visible'); });
                chatInput.addEventListener('blur', () => { sosContainer.classList.remove('keyboard-visible'); });
                
                chatInput.addEventListener('input', () => {
                    if (chatInput.value.trim()) {
                        micOrSendBtn.innerHTML = '<i data-lucide="send" class="w-5 h-5"></i>';
                    } else {
                        micOrSendBtn.innerHTML = '<i data-lucide="mic" class="w-5 h-5"></i>';
                    }
                    lucide.createIcons();
                });
                
                micOrSendBtn.addEventListener('click', () => {
                    const message = chatInput.value.trim();
                    if (message) {
                        addMessageToChat(message, true, 'text');
                        chatInput.value = '';
                        micOrSendBtn.innerHTML = '<i data-lucide="mic" class="w-5 h-5"></i>';
                        lucide.createIcons();
                    } else {
                        textInputUI.classList.add('hidden');
                        voiceNoteUI.classList.remove('hidden');
                        voiceNoteUI.classList.add('flex');
                        sosContainer.classList.add('recording');
                        let seconds = 0;
                        const timerEl = document.getElementById('voice-note-timer');
                        timerEl.textContent = '00:00';
                        voiceTimer = setInterval(() => {
                            seconds++;
                            const min = Math.floor(seconds / 60).toString().padStart(2, '0');
                            const sec = (seconds % 60).toString().padStart(2, '0');
                            timerEl.textContent = `${min}:${sec}`;
                        }, 1000);
                    }
                });
                
                const stopRecording = (send) => {
                    clearInterval(voiceTimer);
                    if (send) {
                        const duration = document.getElementById('voice-note-timer').textContent.split(':')[1];
                        addMessageToChat(duration, true, 'voice');
                    }
                    voiceNoteUI.classList.add('hidden');
                    voiceNoteUI.classList.remove('flex');
                    textInputUI.classList.remove('hidden');
                    sosContainer.classList.remove('recording');
                };

                document.getElementById('stop-record-btn').addEventListener('click', () => stopRecording(true));
                document.getElementById('delete-record-btn').addEventListener('click', () => stopRecording(false));

                document.getElementById('attach-btn').addEventListener('click', () => document.getElementById('file-input').click());
                document.getElementById('camera-btn').addEventListener('click', () => renderOverlay('camera-overlay'));

                document.getElementById('file-input').addEventListener('change', (e) => {
                    if (e.target.files.length > 0) {
                        addMessageToChat(e.target.files[0].name, true, 'file');
                    }
                });

                document.getElementById('audio-call-btn').addEventListener('click', () => renderOverlay('audio-call', coachData));
                document.getElementById('video-call-btn').addEventListener('click', () => renderOverlay('video-call', coachData));
            }
            
            function setupAudioCallPage(coachData) {
                document.getElementById('call-name').innerText = coachData.name;
                const avatarContainer = document.getElementById('call-avatar-container');
                const callStatus = document.getElementById('call-status');
                const avatarColor = coachData.color;
                if (avatarColor) avatarContainer.classList.add(avatarColor);
                avatarContainer.innerText = coachData.avatar;
                
                ringingAudio.loop = true;
                const playPromise = ringingAudio.play();
                if (playPromise !== undefined) {
                    playPromise.catch(e => { if(e.name !== "AbortError") console.error("Audio play failed:", e); });
                }

                document.getElementById('end-call-btn').addEventListener('click', () => {
                    ringingAudio.pause();
                    ringingAudio.currentTime = 0;
                    closeOverlay();
                    addMessageToChat('Audio call ended', false);
                });

                ['speaker-btn', 'mute-btn', 'record-btn'].forEach(id => {
                    document.getElementById(id).addEventListener('click', (e) => {
                        beepAudio.play().catch(e => {});
                        const btn = e.currentTarget;
                        btn.classList.toggle('active');
                        const action = id.split('-')[0];
                        const isActive = btn.classList.contains('active');
                        callStatus.textContent = `${action.charAt(0).toUpperCase() + action.slice(1)} ${isActive ? 'On' : 'Off'}`;
                    });
                });
            }

            async function setupVideoCallPage(coachData) {
                document.getElementById('video-call-name').innerText = coachData.name;
                document.getElementById('video-call-bg-icon').dataset.lucide = "user-circle-2";
                lucide.createIcons();

                const videoElement = document.getElementById('user-video');
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({ video: true });
                    videoElement.srcObject = mediaStream;
                } catch (err) {
                    console.error("Camera access denied:", err);
                    videoElement.parentNode.innerHTML = `<div class="w-full h-full flex items-center justify-center text-center text-xs text-red-400 p-2">Camera access denied.</div>`;
                }
                
                ringingAudio.loop = true;
                const playPromise = ringingAudio.play();
                if (playPromise !== undefined) {
                    playPromise.catch(e => { if(e.name !== "AbortError") console.error("Audio play failed:", e); });
                }
                
                document.getElementById('toggle-video-btn').addEventListener('click', (e) => {
                    beepAudio.play();
                    const btn = e.currentTarget;
                    const icon = btn.querySelector('i');
                    if (mediaStream) {
                        const videoTrack = mediaStream.getVideoTracks()[0];
                        videoTrack.enabled = !videoTrack.enabled;
                        btn.classList.toggle('active');
                        icon.dataset.lucide = videoTrack.enabled ? 'video-off' : 'video';
                        lucide.createIcons();
                    }
                });

                document.getElementById('end-video-call-btn').addEventListener('click', () => {
                    ringingAudio.pause();
                    ringingAudio.currentTime = 0;
                    closeOverlay();
                    addMessageToChat('Video call ended', false);
                });
            }
            
            async function setupCameraOverlay() {
                const videoElement = document.getElementById('camera-preview');
                document.getElementById('close-camera-btn').addEventListener('click', closeOverlay);
                 try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
                    videoElement.srcObject = mediaStream;
                } catch (err) {
                    console.error("Camera access denied:", err);
                    overlayContainer.innerHTML = `<div class="w-full h-full flex items-center justify-center text-center text-lg text-white p-4">Camera access was denied.</div>`;
                     setTimeout(closeOverlay, 2000);
                }

                document.getElementById('capture-btn').addEventListener('click', () => {
                    addMessageToChat('Photo.jpg', true, 'image');
                    closeOverlay();
                });
            }

            function setupConnectWearableListeners() {
                setupDetailPage(() => navigateTo('profile'));
                const connectBtns = document.querySelectorAll('.connect-btn');
                const statusEl = document.getElementById('connection-status');

                connectBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        // Reset all other buttons
                        connectBtns.forEach(b => {
                            if (b !== btn) {
                                b.classList.remove('bg-green-500', 'text-white');
                                if (!b.classList.contains('bg-blue-600')) { // Don't reset the primary new device button styling
                                    b.classList.add('bg-blue-100', 'text-blue-700');
                                }
                                b.textContent = 'Connect';
                                b.disabled = false;
                            }
                        });

                        btn.textContent = 'Connecting...';
                        btn.disabled = true;

                        setTimeout(() => {
                            btn.classList.remove('bg-blue-100', 'text-blue-700', 'bg-blue-600');
                            btn.classList.add('bg-green-500', 'text-white');
                            btn.textContent = 'Connected';
                            statusEl.textContent = 'Device Connected';
                            statusEl.classList.remove('text-red-500');
                            statusEl.classList.add('text-green-500');
                        }, 1500);
                    });
                });
            }

            function setupPlanTabs() {
                const mainTabButtons = document.querySelectorAll('.tab-button');
                const mainTabContents = document.querySelectorAll('.tab-content');
                mainTabButtons.forEach(button => {
                    button.addEventListener('click', () => {
                        mainTabButtons.forEach(btn => { 
                            btn.classList.remove('text-blue-600', 'border-blue-600'); 
                            btn.classList.add('text-gray-500'); 
                        });
                        mainTabContents.forEach(content => content.classList.add('hidden'));
                        button.classList.add('text-blue-600', 'border-blue-600');
                        document.getElementById(`${button.dataset.tab}-content`).classList.remove('hidden');
                    });
                });
                
                setupHomeAndPlanItemListeners();
            }

            function setupSosButton() {
                const sosButton = document.getElementById('sos-button');
                const sosProgress = document.getElementById('sos-progress');
                const messageBox = document.getElementById('message-box');
                const closeMessageBox = document.getElementById('close-message-box');
                let pressTimer;

                const startPress = (e) => { e.preventDefault(); sosProgress.style.width = '100%'; pressTimer = setTimeout(() => messageBox.classList.remove('hidden'), 500); };
                const endPress = () => { clearTimeout(pressTimer); sosProgress.style.width = '0%'; };

                sosButton.addEventListener('mousedown', startPress);
                sosButton.addEventListener('mouseup', endPress);
                sosButton.addEventListener('mouseleave', endPress);
                sosButton.addEventListener('touchstart', startPress);
                sosButton.addEventListener('touchend', endPress);
                closeMessageBox.addEventListener('click', () => messageBox.classList.add('hidden'));
            }

            function startApp() {
                renderScreen('splash');
                setTimeout(() => {
                    renderScreen('login');
                }, 1500);
            }

            startApp();
        });
    </script>
</body>
</html>
